[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectbrain"
version = "1.4.0"
description = "ProjectBrain Python SDK"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "httpx",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "notion-client>=2.0",
    "msal>=1.0",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.0",
    "pypdf>=4.0",
    "mammoth>=1.6",
    "markdownify>=0.11",
    "openai>=1.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mcp>=1.2.0",
    "google-genai>=0.3.0",
    "pillow>=10.0",
    "tenacity>=8.2",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "python-pptx>=1.0.0",
    "networkx>=3.0",
    "graphifyy>=0.3.28",
]

[project.optional-dependencies]
# Local, offline OCR (CPU). Install with:  pip install -e ".[ocr]"
# Heavy: paddlepaddle pulls in large CPU inference libs. First run also downloads
# the OCR models (a few MB per language) to ~/.paddleocr.
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "pymupdf>=1.23",
    "numpy",
]
ocr-cpu = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "pymupdf>=1.23",
    "numpy",
]
ocr-gpu = [
    "paddleocr>=2.7",
    "paddlepaddle-gpu>=2.6",
    "pymupdf>=1.23",
    "numpy",
]
ocr-onnx = [
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.17",
    "pymupdf>=1.23",
    "numpy",
]
ocr-onnx-gpu = [
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime-gpu>=1.17",
    "pymupdf>=1.23",
    "numpy",
]
graphify-gpu = [
    "torch>=2.2",
    "sentence-transformers>=2.6",
    "scipy>=1.11",
]
graphify-cuda = [
    "torch>=2.2",
    "sentence-transformers>=2.6",
    "cugraph-cu12>=24.0",
    "cudf-cu12>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/projectbrain", "extensions_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
